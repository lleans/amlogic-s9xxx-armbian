# kernel-config/local.conf
#
# Kernel config overrides re-applied on top of ophub's upstream config by
# sync.sh. One "CONFIG_SYMBOL=value" per line; '#' comments and blank lines
# are ignored.
#
# These exist because kernel-config/ is a full copy of ophub's config (the
# compile action replaces the config directory rather than merging), so any
# local edit has to be re-applied whenever upstream regenerates theirs.

# In-kernel driver for RTL8821AU / RTL8811AU USB Wi-Fi adapters.
#
# ophub ships this disabled, so the adapters this project targets have no
# driver unless it is enabled. Linux 6.14+ provides rtw88_8821au natively;
# the out-of-tree morrownr/8821au-20210708 driver is not usable there (it
# targets the pre-6.14 cfg80211 API and fails to compile on 6.18).
#
# The symbol does not exist before Linux 6.14 - on older kernels this line
# would be silently ignored, which is why sync.sh only vendors config-6.18.
CONFIG_RTW88_8821AU=m
