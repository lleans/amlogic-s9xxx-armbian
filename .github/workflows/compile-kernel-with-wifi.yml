#==========================================================================
# Description: Compile a kernel with the RTL8821AU Wi-Fi driver baked in
#
# New, isolated addition — does not modify any upstream workflow. See
# docs/superpowers/specs/2026-07-19-rtl8821au-driver-injection-design.md
#==========================================================================

name: Compile kernel with Wi-Fi driver

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source code repository."
        required: false
        default: "unifreq"
        type: string
      kernel_version:
        description: "Kernel version (family, e.g. 6.12.y)."
        required: false
        default: "6.12.y"
        type: string
      kernel_auto:
        description: "Automatically use the latest version in the series."
        required: false
        default: true
        type: boolean
      kernel_usage:
        description: "Tag suffix for the published kernel release."
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - flippy
          - beta
      kernel_toolchain:
        description: "Kernel compilation toolchain."
        required: false
        default: "gcc"
        type: string
  schedule:
    - cron: "0 18 * * 0"

concurrency:
  group: compile-kernel-with-wifi
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Etc/UTC

jobs:
  build:
    # The kernel-compile action defaults to the arm64-only Docker image
    # "ophub/armbian-trixie:arm64" (see recompile's launch_docker_container(),
    # which never passes --platform to `docker run`). On an x86_64 runner
    # this fails with "no matching manifest for linux/amd64" - a native arm64
    # runner is required, matching upstream's own compile-kernel.yml.
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The three steps below are copied from upstream's compile-kernel.yml.
      # A kernel build needs far more than the runner's default root
      # filesystem offers; without them the compile runs out of space and
      # fails deep into the ~60 minute build.
      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile kernel
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source || 'unifreq' }}
          kernel_version: ${{ inputs.kernel_version || '6.12.y' }}
          kernel_auto: ${{ inputs.kernel_auto == false && 'false' || 'true' }}
          kernel_toolchain: ${{ inputs.kernel_toolchain || 'gcc' }}
          docker_hostpath: /builder

      - name: Inject RTL8821AU driver into kernel modules package
        env:
          # The compile action runs from its own checkout (github.action_path),
          # not this repo's checkout - PACKAGED_OUTPUTPATH is the absolute path
          # it exports for the real output directory. A hardcoded relative
          # "compile-kernel/output" would silently point at the wrong tree.
          KERNEL_OUTPUT_DIR: ${{ env.PACKAGED_OUTPUTPATH }}
          # The injector's scratch space (toolchain download + extraction, the
          # unwrapped kernel package, the compiled module) is multi-GB. mktemp
          # honors TMPDIR, so pointing it at the extended volume keeps that
          # scratch off the root filesystem, which the disk step deliberately
          # filled to within ~4GB of capacity.
          TMPDIR: /builder/tmp
        run: |
          mkdir -p /builder/tmp
          chmod +x driver-injection/8821au/inject-driver.sh
          driver-injection/8821au/inject-driver.sh

      - name: Upload kernel packages to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_${{ inputs.kernel_usage || 'stable' }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
